
<div id="erd" style="padding:8px 0"></div>
<style>
#erd svg { width:100% !important; }
#erd svg.erDiagram .divider path { stroke-opacity:0.4; }
#erd svg.erDiagram .row-rect-odd path,
#erd svg.erDiagram .row-rect-odd rect,
#erd svg.erDiagram .row-rect-even path,
#erd svg.erDiagram .row-rect-even rect { stroke:none !important; }
</style>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '12px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
    primaryColor: dark ? '#2a2860' : '#EEEDFE',
    primaryBorderColor: dark ? '#534AB7' : '#534AB7',
    primaryTextColor: dark ? '#CECBF6' : '#3C3489',
  },
});
const diagram = `erDiagram
  AppUser {
    string Id PK
    string FirstName
    string LastName
    string Email
    string PhoneNumber
    string ProfilePhotoUrl
    string ProfilePhotoPublicId
    bool IsProfileComplete
    bool ShowSalary
    int ExperienceYears
    string CareerLevel
    datetime CreatedAt
  }
  UserPreference {
    int Id PK
    string UserId FK
    string JobTypes
    string WorkplaceTypes
    string InterestedCategories
    decimal MinSalary
    string InterestedJobTitles
  }
  CV {
    int Id PK
    string UserId FK
    string Url
    string PublicId
    string FileName
    datetime UploadedAt
  }
  JobCategory {
    int Id PK
    string Name
    string Slug
    string IconUrl
  }
  Job {
    int Id PK
    string Title
    string Description
    string Location
    string Skills
    string JobType
    string WorkplaceType
    decimal SalaryMin
    decimal SalaryMax
    int CategoryId FK
    string PostedById FK
    string Status
    datetime CreatedAt
    datetime ExpiresAt
  }
  Application {
    int Id PK
    string UserId FK
    int JobId FK
    datetime AppliedAt
    string Status
    float AIScore
    string AIFeedback
  }
  SavedJob {
    string UserId FK
    int JobId FK
    datetime SavedAt
  }
  AppUser ||--o| UserPreference : has
  AppUser ||--o| CV : has
  AppUser ||--o{ Application : submits
  AppUser ||--o{ SavedJob : saves
  AppUser ||--o{ Job : posts
  JobCategory ||--o{ Job : categorizes
  Job ||--o{ Application : receives
  Job ||--o{ SavedJob : savedIn
`;
const { svg } = await mermaid.render('erd-inner', diagram);
document.getElementById('erd').innerHTML = svg;
document.querySelectorAll('#erd svg.erDiagram .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0],nums[2],nums[4],nums[6]];
  const ys = [nums[1],nums[3],nums[5],nums[7]];
  const x=Math.min(...xs),y=Math.min(...ys),w=Math.max(...xs)-x,h=Math.max(...ys)-y;
  const rect=document.createElementNS('http://www.w3.org/2000/svg','rect');
  rect.setAttribute('x',x);rect.setAttribute('y',y);
  rect.setAttribute('width',w);rect.setAttribute('height',h);rect.setAttribute('rx','8');
  for(const a of['fill','stroke','stroke-width','class','style']){
    if(firstPath.hasAttribute(a))rect.setAttribute(a,firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});
document.querySelectorAll('#erd svg.erDiagram .row-rect-odd path,#erd svg.erDiagram .row-rect-even path').forEach(p=>p.setAttribute('stroke','none'));
</script>
