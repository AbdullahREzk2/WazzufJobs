<div class="auth-page">
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>
  <a routerLink="/login" class="back-btn">← Back to Login</a>

  <div class="auth-container">
    <div class="auth-right" style="margin: 0 auto;">
      <div class="form-card glass-card">
        <div class="form-header">
          <h1>Forgot Password</h1>
          <p>We'll send you a reset link to your email</p>
        </div>

        @if (success) {
          <div class="alert success">
            Check your inbox for a password reset link.
          </div>
          <a routerLink="/login" class="btn-glow submit-btn" style="display:block;text-align:center;text-decoration:none;">
            <span>Back to Login</span>
          </a>
        } @else {
          @if (error) {
            <div class="error-box"><span>⚠️</span> {{ error }}</div>
          }
          <div class="form-body">
            <div class="field">
              <label>Email Address</label>
              <div class="input-wrap">
                <span class="input-icon">📧</span>
                <input
                  type="email"
                  class="input-field"
                  [(ngModel)]="email"
                  placeholder="you@example.com"
                  (keyup.enter)="submit()"
                />
              </div>
            </div>
            <button class="btn-glow submit-btn" (click)="submit()" [disabled]="loading">
              <span *ngIf="!loading">Send Reset Link →</span>
              <span *ngIf="loading" class="spinner"></span>
            </button>
          </div>
        }
      </div>
    </div>
  </div>
</div>
